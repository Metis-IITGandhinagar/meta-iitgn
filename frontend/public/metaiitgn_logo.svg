<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="metaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F766E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#115E59;stop-opacity:1" />
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="220" fill="url(#metaGradient)" filter="url(#logoShadow)" />

  <!-- Inner ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.4" />

  <!-- M monogram - left half -->
  <path d="M 130 330 L 165 210 L 200 330 L 235 210 L 270 330" 
        fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

  <!-- I monogram - vertical bar in center -->
  <rect x="238" y="190" width="36" height="244" fill="#FFFFFF" rx="18" />

  <!-- N monogram - right half -->
  <path d="M 280 330 L 315 190 L 350 330 L 385 190 L 420 330" 
        fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Small accent dots -->
  <circle cx="200" cy="285" r="12" fill="#FFFFFF" opacity="0.6" />
  <circle cx="312" cy="285" r="12" fill="#FFFFFF" opacity="0.6" />
</svg>
